<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0E0B1F"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<title>قَصّ Qass | مونتاج تلقائي لفيديوهاتك</title>
<style>
:root{--g:#7C5CFF;--y:#FF5C8A;--d:#0E0B1F;--c:#1A1635}
*{box-sizing:border-box}body{margin:0;background:var(--d);color:#fff;font-family:Cairo,system-ui,Tahoma,sans-serif;padding:14px;max-width:520px;margin:auto}
h1{font-size:22px;margin:6px 0 4px}h1 b{color:var(--y)}.sub{color:#b9b0ff;font-size:13px;margin-bottom:12px}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #3a3170}
.step{color:var(--y);font-weight:700;margin-bottom:8px}
button{background:linear-gradient(135deg,#7C5CFF,#FF5C8A);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;width:100%;margin-top:6px}
button.sec{background:#3a3170;color:#fff}button:disabled{opacity:.45}
input[type=file]{width:100%}textarea{width:100%;background:#0B1F14;color:#fff;border:1px solid #3a3170;border-radius:10px;padding:8px;min-height:56px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.words span{text-align:center}.words input{background:#0B1F14;color:#fff;border:1px solid #3a3170;border-radius:8px;padding:6px;font-size:16px;text-align:center;min-width:44px}
.words small{display:block;font-size:10px;color:#8a82c8}
.presets{display:flex;flex-wrap:wrap;gap:8px}.p{padding:10px 12px;border-radius:10px;border:2px solid transparent;font-weight:700;cursor:pointer}.p.on{border-color:#fff}
label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px}input[type=range]{flex:1}
video,canvas{width:100%;border-radius:12px;background:#000}.msg{color:#b9b0ff;font-size:14px;margin:6px 0;white-space:pre-wrap}
#cv{display:none}
.logo{display:flex;align-items:center;gap:10px;margin:8px 0 4px}.logo i{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7C5CFF,#FF5C8A);display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:900}.logo b{font-size:28px}.step{color:#fff}#lq,#lib,#vocabbox,#duckl,#sfxcutl{display:none!important}</style></head><body>
<div class="logo"><i>✂</i><b>قَصّ</b></div><div class="sub">ارفع الفيديو وسيب الباقي علينا. كل حاجة بتتعمل على جهازك وفيديوك بيفضل خاص.</div>
<div class="card"><div class="step">١. ارفع الفيديو</div><input type="file" id="f" accept="video/*,audio/*"><div class="msg" id="m1"></div></div>
<div class="card"><div class="step">٢. الكلام في الفيديو</div>
<div class="msg" id="vocabbox">لو في كلمة مكتوبة غلط، اكتبها هنا: الغلط=الصح</div>
<textarea id="vocab" placeholder="جوجل فلو=جوجل فلو&#10;لوكال هب=Local Hub"></textarea>
<button id="tr" disabled>حلّل الكلام</button><div class="msg" id="m2"></div><div class="words" id="words"></div></div>
<div class="card"><div class="step">عنوان الفيديو (اختياري)</div>
<textarea id="ttl" placeholder="اكتب عنوان الهوك (سطر لكل جزء، لحد 3 سطور)&#10;مثال: سرّع مونتاجك&#10;بدقيقة"></textarea>
<label>الحركة<select id="tan"><option value="stretch">مدّ ناعم</option><option value="pop">بوب</option><option value="up">طلوع</option><option value="right">دخول من اليمين</option><option value="blur">ضبابي</option><option value="type">كلمة كلمة</option></select></label>
<button class="sec" id="tpv" type="button">شوف الحركة</button><canvas id="pv" width="360" height="360" style="width:100%;border-radius:12px;background:#0B3D1E;margin-top:8px"></canvas></div>
<div class="card"><div class="step">المؤثرات الصوتية</div>
<label>مؤثرات صوتية تلقائية<input type="checkbox" id="sfxon" checked></label>
<label id="sfxcutl">مؤثر عند القص (اختياري)<select id="sfxcut"><option value="none" selected>بدون</option><option value="whoosh">ووش</option><option value="pop">بوب</option><option value="click">نقرة</option></select></label>
<label id="duckl">أقل من الصوت بـ <span></span><select id="duck"><option value="12">12 dB</option><option value="15" selected>15 dB</option><option value="18">18 dB</option></select></label>
<input id="lq" placeholder="دوّر في المكتبة: ووش / pop / ding ..." style="width:100%;background:#0B1F14;color:#fff;border:1px solid #1d5a35;border-radius:10px;padding:8px;margin:6px 0"><div id="lib" style="max-height:160px;overflow:auto"></div></div>
<div class="card"><div class="step">٣. الشكل والقص</div><div class="presets" id="presets"></div>
<label>قص السكتات<input type="checkbox" id="cut" checked></label>
<label>حساسية القص<select id="sens"><option value="0.7">خفيف</option><option value="0.4" selected>متوسط</option><option value="0.25">سريع</option></select></label>
<label>أقل سكتة تتقص: <span id="gv">0.4</span>ث<input type="range" id="gap" min="0.15" max="1.2" step="0.05" value="0.4"></label>
<label>ظبط علو الصوت -14 LUFS (ريلز/تيك توك)<input type="checkbox" id="loud" checked></label>
<label>شيل الـ "ااا" والتردد<input type="checkbox" id="fil" checked></label>
<label>شيل التكرار (اللقطة المعادة)<input type="checkbox" id="rep" checked></label>
<label>زووم بين المقاطع<input type="checkbox" id="zoom" checked></label>
<button id="rn" disabled>اعمل المونتاج</button><div class="msg" id="m3"></div><canvas id="cv" width="720" height="1280"></canvas></div>
<div class="card" id="res" style="display:none"><div class="step">٤. النتيجة</div><video id="out" controls playsinline></video><a id="dl"><button class="sec">نزّل الفيديو</button></a><div class="msg" id="stat"></div></div>
<video id="src" playsinline muted style="display:none"></video>
<script type="module" src="app.js"></script></body></html>
