<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B3D1E">
<title>Local Cut | مونتاج تلقائي بالمصري</title>
<style>
:root{--g:#00C853;--y:#FFD400;--d:#0B1F14;--c:#12301e}
*{box-sizing:border-box}body{margin:0;background:var(--d);color:#fff;font-family:system-ui,Tahoma,sans-serif;padding:14px;max-width:520px;margin:auto}
h1{font-size:22px;margin:6px 0 4px}h1 b{color:var(--y)}.sub{color:#9fd;font-size:13px;margin-bottom:12px}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #1d5a35}
.step{color:var(--y);font-weight:700;margin-bottom:8px}
button{background:var(--g);color:#04210f;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px;width:100%;margin-top:6px}
button.sec{background:#1d5a35;color:#fff}button:disabled{opacity:.45}
input[type=file]{width:100%}textarea{width:100%;background:#0B1F14;color:#fff;border:1px solid #1d5a35;border-radius:10px;padding:8px;min-height:56px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.words span{text-align:center}.words input{background:#0B1F14;color:#fff;border:1px solid #1d5a35;border-radius:8px;padding:6px;font-size:16px;text-align:center;min-width:44px}
.words small{display:block;font-size:10px;color:#7c9}
.presets{display:flex;flex-wrap:wrap;gap:8px}.p{padding:10px 12px;border-radius:10px;border:2px solid transparent;font-weight:700;cursor:pointer}.p.on{border-color:#fff}
label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px}input[type=range]{flex:1}
video,canvas{width:100%;border-radius:12px;background:#000}.msg{color:#9fd;font-size:14px;margin:6px 0;white-space:pre-wrap}
#cv{display:none}
</style></head><body>
<h1>Local <b>Cut</b> ✂️ مونتاج تلقائي بالمصري</h1><div class="sub">كل حاجة بتشتغل على موبايلك. الفيديو مبيترفعش لأي سيرفر.</div>
<div class="card"><div class="step">1) اختار الفيديو</div><input type="file" id="f" accept="video/*,audio/*"><div class="msg" id="m1"></div></div>
<div class="card"><div class="step">2) تفريغ الكلام</div>
<div class="msg">تصحيح كلمات (اكتب: الغلط=الصح، سطر لكل كلمة):</div>
<textarea id="vocab" placeholder="جوجل فلو=جوجل فلو&#10;لوكال هب=Local Hub"></textarea>
<button id="tr" disabled>فرّغ الكلام</button><div class="msg" id="m2"></div><div class="words" id="words"></div></div>
<div class="card"><div class="step">2.5) عنوان بمدّ الكلمات (كشيدة)</div>
<textarea id="ttl" placeholder="اكتب عنوان الهوك (سطر لكل جزء، لحد 3 سطور)&#10;مثال: سرّع مونتاجك&#10;بدقيقة"></textarea>
<label>الحركة<select id="tan"><option value="stretch">مدّ ناعم</option><option value="pop">بوب</option><option value="up">طلوع</option><option value="right">دخول من اليمين</option><option value="blur">ضبابي</option><option value="type">كلمة كلمة</option></select></label>
<button class="sec" id="tpv" type="button">شوف الحركة</button><canvas id="pv" width="360" height="360" style="width:100%;border-radius:12px;background:#0B3D1E;margin-top:8px"></canvas></div>
<div class="card"><div class="step">3.7) مؤثرات صوتية</div>
<label>مؤثرات تلقائية (عند القص، الأرقام، الكلمات المهمة)<input type="checkbox" id="sfxon" checked></label>
<label>مؤثر عند القص (اختياري)<select id="sfxcut"><option value="none" selected>بدون</option><option value="whoosh">ووش</option><option value="pop">بوب</option><option value="click">نقرة</option></select></label>
<label>أقل من الصوت بـ <span></span><select id="duck"><option value="12">12 dB</option><option value="15" selected>15 dB</option><option value="18">18 dB</option></select></label>
<input id="lq" placeholder="دوّر في المكتبة: ووش / pop / ding ..." style="width:100%;background:#0B1F14;color:#fff;border:1px solid #1d5a35;border-radius:10px;padding:8px;margin:6px 0"><div id="lib" style="max-height:160px;overflow:auto"></div></div>
<div class="card"><div class="step">3) الاستايل والقص</div><div class="presets" id="presets"></div>
<label>قص السكتات<input type="checkbox" id="cut" checked></label>
<label>حساسية القص<select id="sens"><option value="0.7">خفيف</option><option value="0.4" selected>متوسط</option><option value="0.25">سريع</option></select></label>
<label>أقل سكتة: <span id="gv">0.4</span>ث<input type="range" id="gap" min="0.15" max="1.2" step="0.05" value="0.4"></label>
<label>ظبط علو الصوت -14 LUFS (ريلز/تيك توك)<input type="checkbox" id="loud" checked></label>
<label>شيل الـ "ااا" والتردد<input type="checkbox" id="fil" checked></label>
<label>زووم بين المقاطع<input type="checkbox" id="zoom" checked></label>
<button id="rn" disabled>اعمل الفيديو</button><div class="msg" id="m3"></div><canvas id="cv" width="720" height="1280"></canvas></div>
<div class="card" id="res" style="display:none"><div class="step">النتيجة</div><video id="out" controls playsinline></video><a id="dl"><button class="sec">نزّل الفيديو</button></a><div class="msg" id="stat"></div></div>
<video id="src" playsinline muted style="display:none"></video>
<script type="module" src="app.js"></script></body></html>
